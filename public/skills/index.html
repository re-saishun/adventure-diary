<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - Toram Online Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans transition-colors duration-300">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out fixed md:relative h-full z-20">
            <div class="flex items-center justify-center p-4 bg-gray-200 dark:bg-gray-700">
                <img src="/logo.svg" alt="Logo" class="h-10 w-10 mr-2">
                <h1 class="text-2xl font-bold">Toram DB</h1>
            </div>
            <nav>
                <a href="/" class="block py-2 px-4 text-lg hover:bg-gray-200 dark:hover:bg-gray-700">Home</a>
                <a href="/items/" class="block py-2 px-4 text-lg hover:bg-gray-200 dark:hover:bg-gray-700">Items</a>
                <a href="/monsters/" class="block py-2 px-4 text-lg hover:bg-gray-200 dark:hover:bg-gray-700">Monsters</a>
                <a href="/skills/" class="block py-2 px-4 text-lg hover:bg-gray-200 dark:hover:bg-gray-700">Skills</a>
            </nav>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white dark:bg-gray-800 shadow-md">
                <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                    <button id="sidebar-toggle" class="md:hidden px-4 py-2 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                        Menu
                    </button>
                    <div class="flex items-center space-x-4 ml-auto">
                        <p class="text-sm text-gray-500 dark:text-gray-400 hidden sm:block">Skills Database</p>
                        <button id="theme-toggle" class="px-4 py-2 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700 text-yellow-500 dark:text-blue-300">
                            <svg id="theme-icon-sun" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 18a6 6 0 100-12 6 6 0 000 12z" />
                            </svg>
                            <svg id="theme-icon-moon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 dark:bg-gray-900">
                <div id="data-container" class="container mx-auto px-4 py-8">
                    <!-- Data will be displayed here -->
                </div>
            </main>
        </div>
    </div>
    <script src="/js/script.js"></script>
    <script>
        const skillCategories = ['Blade Skills', 'Shot Skills', 'Magic Skills', 'Martial Skills', 'Dual Sword Skills', 'Mononofu Skills', 'Halberd Skills', 'Bare Hand Skills', 'Crusher Skills', 'Guard Skills', 'Shield Skills', 'Dagger Skills', 'Knight Skills', 'Hunter Skills', 'Priest Skills', 'Dark Power Skills', 'Magic Blade Skills', 'Ninja Skills', 'Assassin Skills', 'Wizard Skills', 'Survival Skills', 'Support Skills', 'Battle Skills', 'Minstrel Skills', 'Dancer Skills', 'Smith Skills', 'Alchemy Skills', 'Tamer Skills'];
        const googleSheetUrl = 'YOUR_GOOGLE_SHEET_URL';
        fetchGoogleSheetData(googleSheetUrl).then(data => {
            const groupedData = groupData(data, skillCategories);
            createAccordion(groupedData);
        });
    </script>
</body>
</html>
