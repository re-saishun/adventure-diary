<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsters - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="nav-header">
            <div class="logo-container">
                <img src="../img/icons/brand_ico.png" alt="Logo" class="logo-img">
                <span class="logo-name">Adv' Diary</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="../" class="home-link"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
            <a href="../item/"><img src="../img/icons/items_ico.png"><span>Items</span></a>
            <a href="./"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
            <a href="../skill/"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
        </div>
        <div class="nav-links-footer">
            <a href="../kontribusi/"><span>Kontribusi</span></a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Monsters</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div class="toolbar">
            <input type="text" id="search-bar" placeholder="Cari monster...">
            <select id="type-filter">
                <option value="all">Semua Tipe</option>
                <option value="Normal">Normal</option>
                <option value="Mini Boss">Mini Boss</option>
                <option value="Boss">Boss</option>
            </select>
        </div>
        <div id="monster-list" class="accordion-group"></div>
    </main>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        let allMonsters = [];

        async function loadMonsters() {
            try {
                const response = await fetch('../database/monsters.json');
                allMonsters = await response.json();
                displayMonsters(allMonsters);
                setupAccordionAndPermalinks();
            } catch (error) {
                console.error('Error loading monsters:', error);
                document.getElementById('monster-list').innerHTML = '<p>Gagal memuat monster.</p>';
            }
        }

        function displayMonsters(monsters) {
            const monsterList = document.getElementById('monster-list');
            let html = '';
            for (const monster of monsters) {
                const monsterId = monster.name.replace(/ /g, '-');
                const dropsHtml = monster.drops.map(drop => {
                    return `<li><a href="../item/#${drop.replace(/ /g, '-')}">${drop}</a></li>`;
                }).join('');
                
                const creditTag = monster.credit ? `<div class="credit-tag">${monster.credit}</div>` : '';

                html += `
                    <details class="acc-item" id="${monsterId}">
                        <summary>
                            <span class="item-header-main"><a href="#${monsterId}">${monster.name}</a></span>
                            <div class="item-header-stats">
                                <span>${monster.type}</span>
                            </div>
                        </summary>
                        <div class="content-wrapper">
                            <div class="content-body">
                                <b>Level:</b> ${monster.level || 'N/A'}<br>
                                <b>HP:</b> ${monster.hp ? monster.hp.toLocaleString() : 'N/A'}<br>
                                <b>EXP:</b> ${monster.exp ? monster.exp.toLocaleString() : 'N/A'}<br>
                                <b>Lokasi:</b> ${monster.location || 'N/A'}<br>
                                <b>Dapat Dijinakkan:</b> ${monster.tamable ? 'Ya' : 'Tidak'}<br>
                                <b>Drops:</b>
                                <ul>
                                    ${dropsHtml}
                                </ul>
                            </div>
                        </div>
                        ${creditTag}
                    </details>
                `;
            }
            monsterList.innerHTML = html;
        }
        
        function setupAccordionAndPermalinks() {
            const autoClose = true;
            document.querySelectorAll('.acc-item').forEach(el => {
                const summary = el.querySelector('summary');
                const wrapper = el.querySelector('.content-wrapper');
                summary.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A') return; 
                    e.preventDefault();
                    if (el.open) {
                        el.classList.remove('is-open');
                        wrapper.style.height = '0px';
                        setTimeout(() => el.open = false, 310);
                    } else {
                        if (autoClose) {
                            document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                o.classList.remove('is-open');
                                o.querySelector('.content-wrapper').style.height = '0px';
                                setTimeout(() => o.open = false, 310);
                            });
                        }
                        el.open = true;
                        el.classList.add('is-open');
                        wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                    }
                });
            });

            // Permalink handling
            if (window.location.hash) {
                const monsterId = window.location.hash.substring(1);
                const monsterElement = document.getElementById(monsterId);
                if (monsterElement) {
                    setTimeout(() => {
                        // Ensure it's not already open before clicking
                        if (!monsterElement.open) {
                           monsterElement.querySelector('summary').click();
                        }
                        monsterElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 150); 
                }
            }
        }

        function filterAndSearchMonsters() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();
            const typeFilter = document.getElementById('type-filter').value;

            const filteredMonsters = allMonsters.filter(monster => {
                const nameMatch = monster.name.toLowerCase().includes(searchTerm);
                const typeMatch = typeFilter === 'all' || monster.type === typeFilter;
                return nameMatch && typeMatch;
            });

            displayMonsters(filteredMonsters);
            // Re-setup the accordion for the filtered results
            setupAccordionAndPermalinks(); 
        }
        
        document.getElementById('search-bar').addEventListener('input', filterAndSearchMonsters);
        document.getElementById('type-filter').addEventListener('change', filterAndSearchMonsters);

        loadMonsters();

    </script>
</body>
</html>
