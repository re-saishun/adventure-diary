<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Diary - Toram Online Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="logo">ADVENTURE DIARY</div>
        <a href="./"><img src="img/icons/brand_ico.png"><span>Home</span></a>
        <a href="item/"><img src="img/icons/1h_ico.png"><span>Items</span></a>
        <a href="monster/"><img src="img/icons/boss_ico.png"><span>Monsters</span></a>
        <a href="skill/"><img src="img/icons/skills/sk_magic_finale.png"><span>Skills</span></a>
    </nav>

    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Dashboard</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>

        <section class="hero">
            <h1>Toram Online Database</h1>
            <p>Penyimpanan data petualangan pribadi dan informasi game terlengkap.</p>
        </section>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Items</h3>
                <p id="count-item">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Monsters</h3>
                <p id="count-monster">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Skills</h3>
                <p id="count-skill">Loading...</p>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function loadStats() {
            try {
                const itemRes = await fetch('database/items.json');
                const items = await itemRes.json();
                document.getElementById('count-item').innerText = items.length + " Total Items";
            } catch (err) {
                document.getElementById('count-item').innerText = "Data not found";
            }
        }

        loadStats();
    </script>
</body>
</html>
