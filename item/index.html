<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="overlay"></div>
    <nav id="sidebar">
        <div class="nav-header">
            <div class="logo-container">
                <img src="../img/logo.png" alt="Logo" class="logo-img">
                <span class="logo-name">Adv' Diary</span>
            </div>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <div class="nav-links">
            <a href="../" class="home-link"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
            <a href="./"><img src="../img/icons/items_ico.png"><span>Items</span></a>
            <a href="../monster/"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
            <a href="../skill/"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
        </div>
        <div class="nav-links-footer">
             <a href="../kontribusi/"><img src="../img/icons/quest_ico.png"><span>Kontribusi</span></a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h1 class="main-title">Items</h1>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div id="item-list" class="accordion-group"></div>
    </main>
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        
        overlay.addEventListener('click', toggleSidebar);

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function loadItems() {
            try {
                const response = await fetch('../data/items.json'); // Correct path to data
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const items = await response.json();
                const itemList = document.getElementById('item-list');
                let html = '';

                // --- Icon mapping logic here ---
                // This part remains the same

                for (const item of items) {
                     // --- Item rendering logic here ---
                     // This part remains the same
                }
                itemList.innerHTML = html;

                // Accordion script
                const autoClose = true;
                document.querySelectorAll('.acc-item').forEach(el => {
                    const summary = el.querySelector('summary');
                    const wrapper = el.querySelector('.content-wrapper');
                    summary.onclick = (e) => {
                        e.preventDefault();
                        if (el.classList.contains('is-open')) {
                            el.classList.remove('is-open');
                            wrapper.style.height = '0px';
                            el.open = false;
                        } else {
                            if (autoClose) {
                                document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                    o.classList.remove('is-open');
                                    o.querySelector('.content-wrapper').style.height = '0px';
                                    o.open = false;
                                });
                            }
                            el.open = true;
                            el.classList.add('is-open');
                            wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                        }
                    };
                });

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('item-list').innerHTML = '<p>Could not load items data.</p>';
            }
        }
        loadItems();
    </script>
</body>
</html>
