<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="logo">ADVENTURE DIARY</div>
        <a href="../"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
        <a href="./"><img src="../img/icons/items_ico.png"><span>Items</span></a>
        <a href="../monster/"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
        <a href="../skill/"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Items</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div id="item-list" class="accordion-group"></div>
    </main>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function loadItems() {
            try {
                const response = await fetch('../database/items.json');
                const items = await response.json();
                const itemList = document.getElementById('item-list');
                let html = '';
                for (const item of items) {
                    let contentHtml = `Type: ${item.type}<br>`
                    contentHtml += `ATK: ${item.basic_stat}<br>`
                    if(item.secondary_stat){
                      contentHtml += `Stability: ${item.secondary_stat}<br>`
                    }
                    if(item.item_stats && item.item_stats.length > 0) {
                        contentHtml += 'Stats:<br><ul>';
                        for (const stat of item.item_stats) {
                            contentHtml += `<li>${stat}</li>`;
                        }
                        contentHtml += '</ul>';
                    }
                    if(item.source){
                        contentHtml += `Source: ${item.source.type}<br>`
                        if(item.source.mobs && item.source.mobs.length > 0){
                            contentHtml += 'Dropped by:<br><ul>';
                            for (const mob of item.source.mobs) {
                                contentHtml += `<li>${mob}</li>`;
                            }
                            contentHtml += '</ul>';
                        }
                    }


                    html += `
                        <details class="acc-item">
                            <summary>
                                <span>${item.name}</span>
                                <span class="acc-icon">▼</span>
                            </summary>
                            <div class="content-wrapper">
                                <div class="content-body">
                                    ${contentHtml}
                                </div>
                            </div>
                        </details>
                    `;
                }
                itemList.innerHTML = html;

                const autoClose = true;
                document.querySelectorAll('.acc-item').forEach(el => {
                    const summary = el.querySelector('summary');
                    const wrapper = el.querySelector('.content-wrapper');
                    summary.onclick = (e) => {
                        e.preventDefault();
                        if (el.open) {
                            el.classList.remove('is-open');
                            wrapper.style.height = '0px';
                            setTimeout(() => el.open = false, 310);
                        } else {
                            if (autoClose) {
                                document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                    o.classList.remove('is-open');
                                    o.querySelector('.content-wrapper').style.height = '0px';
                                    setTimeout(() => o.open = false, 310);
                                });
                            }
                            el.open = true;
                            el.classList.add('is-open');
                            wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                        }
                    };
                });

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('item-list').innerHTML = '<p>Could not load items.</p>';
            }
        }
        loadItems();
    </script>
</body>
</html>
