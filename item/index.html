<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="nav-header">
            <div class="logo-container">
                <img src="../img/icons/brand_ico.png" alt="Logo" class="logo-img">
                <span class="logo-name">Adv' Diary</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="../" class="home-link"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
            <a href="./"><img src="../img/icons/items_ico.png"><span>Items</span></a>
            <a href="../monster/"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
            <a href="../skill/"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Items</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div id="item-list" class="accordion-group"></div>
    </main>
    <script>
        function toggleSidebar() {
            const nav = document.getElementById('sidebar');
            const main = document.querySelector('main');
            nav.classList.toggle('active');
            main.classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function loadItems() {
            try {
                const response = await fetch('../database/items.json');
                const items = await response.json();
                const itemList = document.getElementById('item-list');
                let html = '';

                const iconMap = {
                    "One-Handed Sword": "1h_ico.png",
                    "Two-Handed Sword": "2h_ico.png",
                    "Bow": "bow_ico.png",
                    "Bowgun": "bwg_ico.png",
                    "Staff": "stf_ico.png",
                    "Magic Device": "md_ico.png",
                    "Knuckle": "knu_ico.png",
                    "Halberd": "hb_ico.png",
                    "Katana": "ktn_ico.png",
                    "Body Armor": "armor_ico.png",
                    "Additional Gear": "add_ico.png",
                    "Special Gear": "special_ico.png",
                    "Shield": "shield_ico.png",
                    "Dagger": "dagger_ico.png",
                    "Arrow": "arrow_ico.png",
                    "Ninjutsu Scroll": "scroll_ico.png",
                    "Crysta Normal Base": "crysta_normal_base.png",
                    "Crysta Normal Up": "crysta_normal_up.png",
                    "Crysta Normal Max": "crysta_normal_max.png",
                    "Crysta Weapon Base": "crysta_weapon_base.png",
                    "Crysta Weapon Up": "crysta_weapon_up.png",
                    "Crysta Weapon Max": "crysta_weapon_max.png",
                    "Crysta Armor Base": "crysta_armor_base.png",
                    "Crysta Armor Up": "crysta_armor_up.png",
                    "Crysta Armor Max": "crysta_armor_max.png",
                    "Crysta Additional Base": "crysta_add_base.png",
                    "Crysta Additional Up": "crysta_add_up.png",
                    "Crysta Additional Max": "crysta_add_max.png",
                    "Crysta Special Base": "crysta_special_base.png",
                    "Crysta Special Up": "crysta_special_up.png",
                    "Crysta Special Max": "crysta_special_max.png",
                    "Material Metal": "metal_ico.png",
                    "Material Cloth": "cloth_ico.png",
                    "Material Beast": "beast_ico.png",
                    "Material Mana": "mana_ico.png",
                    "Material Medicine": "medicine_ico.png",
                    "Material Ore": "ore_ico.png"
                };

                for (const item of items) {
                    const itemType = item.type.includes('-') ? item.type.split('-')[1] : item.type;
                    const iconFilename = iconMap[itemType] || 'default_ico.png';
                    const iconPath = `../img/icons/${iconFilename}`;
                    const statType = item.type === 'Body Armor' || item.type === 'Additional Gear' || item.type === 'Special Gear' ? 'DEF' : 'ATK';

                    let contentHtml = `<b>Type:</b> ${item.type}<br>`;

                    if (item.item_stats && item.item_stats.length > 0) {
                        contentHtml += '<b>Stats:</b><ul>';
                        for (const stat of item.item_stats) {
                            contentHtml += `<li>${stat}</li>`;
                        }
                        contentHtml += '</ul>';
                    }

                    if (item.source) {
                        contentHtml += `<b>Source:</b> ${item.source.type}<br>`;
                        if (item.source.mobs && item.source.mobs.length > 0) {
                            contentHtml += '<ul>';
                            for (const mob of item.source.mobs) {
                                contentHtml += `<li><a href="../monster#${mob.replace(/ /g, '-')}">${mob}</a></li>`;
                            }
                            contentHtml += '</ul>';
                        }
                    }

                    html += `
                        <details class="acc-item">
                            <summary>
                                <span class="item-header-main">${item.name}</span>
                                <div class="item-header-stats">
                                    <span>${item.basic_stat} ${statType} ${item.secondary_stat ? `(${item.secondary_stat})` : ''}</span>
                                </div>
                                <img src="${iconPath}" class="item-type-icon">
                            </summary>
                            <div class="content-wrapper">
                                <div class="content-body">
                                    ${contentHtml}
                                </div>
                            </div>
                        </details>
                    `;
                }
                itemList.innerHTML = html;

                const autoClose = true;
                document.querySelectorAll('.acc-item').forEach(el => {
                    const summary = el.querySelector('summary');
                    const wrapper = el.querySelector('.content-wrapper');
                    summary.onclick = (e) => {
                        e.preventDefault();
                        if (el.open) {
                            el.classList.remove('is-open');
                            wrapper.style.height = '0px';
                            setTimeout(() => el.open = false, 310);
                        } else {
                            if (autoClose) {
                                document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                    o.classList.remove('is-open');
                                    o.querySelector('.content-wrapper').style.height = '0px';
                                    setTimeout(() => o.open = false, 310);
                                });
                            }
                            el.open = true;
                            el.classList.add('is-open');
                            wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                        }
                    };
                });

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('item-list').innerHTML = '<p>Could not load items.</p>';
            }
        }
        loadItems();
    </script>
</body>
</html>
