<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="nav-header">
            <div class="logo-container">
                <img src="../img/icons/brand_ico.png" alt="Logo" class="logo-img">
                <span class="logo-name">Adv' Diary</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="../" class="home-link"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
            <a href="./"><img src="../img/icons/items_ico.png"><span>Items</span></a>
            <a href="../monster/"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
            <a href="../skill/"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
        </div>
        <div class="nav-links-footer">
            <a href="../kontribusi/"><span>Kontribusi</span></a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Items</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div id="item-list" class="accordion-group"></div>
    </main>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        let allItems = [];

        async function loadItems() {
            try {
                const response = await fetch('../database/items.json');
                allItems = await response.json();
                displayItems(allItems);
                setupAccordionAndPermalinks();
            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('item-list').innerHTML = '<p>Could not load items.</p>';
            }
        }

        function displayItems(items) {
            const itemList = document.getElementById('item-list');
            let html = '';
            const iconMap = {
                // ... (icon map remains the same)
            };

            for (const item of items) {
                const itemId = item.name.replace(/ /g, '-');
                const iconFilename = iconMap[item.type] || 'default_ico.png';
                const iconPath = `../img/icons/${iconFilename}`;
                const statType = ('DEF');

                let contentHtml = `<b>Type:</b> ${item.type}<br>`;
                if (item.stats) {
                    contentHtml += '<b>Stats:</b><ul>' + item.stats.map(s => `<li>${s}</li>`).join('') + '</ul>';
                }
                if (item.obtains) {
                    contentHtml += '<b>Obtained from:</b><ul>' + item.obtains.map(o => {
                        // Check if it's a monster and link it
                        return `<li><a href="../monster/#${o.replace(/ /g, '-')}">${o}</a></li>`;
                    }).join('') + '</ul>';
                }
                if (item.notes) {
                    contentHtml += `<br><p><i>${item.notes}</i></p>`;
                }

                const creditTag = item.credit ? `<div class="credit-tag">${item.credit}</div>` : '';

                html += `
                    <details class="acc-item" id="${itemId}">
                        <summary>
                            <span class="item-header-main"><a href="#${itemId}">${item.name}</a></span>
                            <div class="item-header-stats">
                                <span>${item.base_atk || item.base_def || ''} ${item.base_atk ? 'ATK' : 'DEF'}</span>
                            </div>
                            <img src="${iconPath}" class="item-type-icon">
                        </summary>
                        <div class="content-wrapper">
                            <div class="content-body">
                                ${contentHtml}
                            </div>
                        </div>
                        ${creditTag}
                    </details>
                `;
            }
            itemList.innerHTML = html;
        }

        function setupAccordionAndPermalinks() {
            const autoClose = true;
            document.querySelectorAll('.acc-item').forEach(el => {
                const summary = el.querySelector('summary');
                const wrapper = el.querySelector('.content-wrapper');
                summary.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A') return; // Don't toggle if clicking the permalink
                    e.preventDefault();
                    if (el.open) {
                        el.classList.remove('is-open');
                        wrapper.style.height = '0px';
                        setTimeout(() => el.open = false, 310);
                    } else {
                        if (autoClose) {
                            document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                o.classList.remove('is-open');
                                o.querySelector('.content-wrapper').style.height = '0px';
                                setTimeout(() => o.open = false, 310);
                            });
                        }
                        el.open = true;
                        el.classList.add('is-open');
                        wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                    }
                });
            });

            // Permalink handling
            if (window.location.hash) {
                const itemId = window.location.hash.substring(1);
                const itemElement = document.getElementById(itemId);
                if (itemElement) {
                    setTimeout(() => {
                        itemElement.querySelector('summary').click();
                        itemElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            }
        }

        loadItems();
    </script>
</body>
</html>
