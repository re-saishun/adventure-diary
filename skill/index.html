<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - Adventure Diary</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">×</button>
        <div class="nav-header">
            <div class="logo-container">
                <img src="../img/icons/brand_ico.png" alt="Logo" class="logo-img">
                <span class="logo-name">Adv' Diary</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="../" class="home-link"><img src="../img/icons/brand_ico.png"><span>Home</span></a>
            <a href="../item/"><img src="../img/icons/items_ico.png"><span>Items</span></a>
            <a href="../monster/"><img src="../img/icons/monsters_ico.png"><span>Monsters</span></a>
            <a href="./"><img src="../img/icons/skills_ico.png"><span>Skills</span></a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2>Skills</h2>
            <div class="theme-switcher" onclick="toggleTheme()">
                <div class="switcher-ball">
                    <span class="icon-day">☀️</span>
                    <span class="icon-night">🌙</span>
                </div>
            </div>
        </div>
        <div id="skill-list" class="accordion-group"></div>
    </main>
    <script>
        function toggleSidebar() {
            const nav = document.getElementById('sidebar');
            const main = document.querySelector('main');
            nav.classList.toggle('active');
            main.classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function loadSkills() {
            try {
                const response = await fetch('../database/skills.json');
                const skills = await response.json();
                const skillList = document.getElementById('skill-list');
                let html = '';

                for (const skill of skills) {
                    const iconFilename = `sk_${skill.name.toLowerCase().replace(/[ /]/g, '_')}.png`;
                    const iconPath = `../img/icons/skills/${iconFilename}`;

                    let contentHtml = `<b>Element:</b> ${skill.element}<br>`;
                    if (skill.description) {
                        contentHtml += `<b>Description:</b> ${skill.description}`;
                    }

                    html += `
                        <details class="acc-item">
                            <summary>
                                <img src="${iconPath}" class="item-type-icon" onerror="this.src='../img/icons/no_image.png'">
                                <span class="item-header-main">${skill.name}</span>
                            </summary>
                            <div class="content-wrapper">
                                <div class="content-body">
                                    ${contentHtml}
                                </div>
                            </div>
                        </details>
                    `;
                }
                skillList.innerHTML = html;
                setupAccordion();

            } catch (error) {
                console.error('Error loading skills:', error);
                document.getElementById('skill-list').innerHTML = '<p>Could not load skills.</p>';
            }
        }

        function setupAccordion() {
            const autoClose = true;
            document.querySelectorAll('.acc-item').forEach(el => {
                const summary = el.querySelector('summary');
                const wrapper = el.querySelector('.content-wrapper');
                summary.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (el.open) {
                        el.classList.remove('is-open');
                        wrapper.style.height = '0px';
                        setTimeout(() => el.open = false, 310);
                    } else {
                        if (autoClose) {
                            document.querySelectorAll('.acc-item.is-open').forEach(o => {
                                o.classList.remove('is-open');
                                o.querySelector('.content-wrapper').style.height = '0px';
                                setTimeout(() => o.open = false, 310);
                            });
                        }
                        el.open = true;
                        el.classList.add('is-open');
                        wrapper.style.height = wrapper.querySelector('.content-body').scrollHeight + 'px';
                    }
                });
            });
        }
        
        loadSkills();
    </script>
</body>
</html>
